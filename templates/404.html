{% extends 'base.html' %}
{% block title %}Page not found · EduTrack{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-7 col-lg-5">
    <div class="card auth-card text-center">
      <div class="card-body">
        <span class="badge badge-neutral mb-2">404 · Not found</span>
        <h1 class="auth-title">That page does not exist</h1>
        <p class="auth-subtitle">The address may be incorrect, or the record may have been removed.</p>
        <a href="{% url 'dashboard:home' %}" class="btn btn-primary">Go to my dashboard</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}

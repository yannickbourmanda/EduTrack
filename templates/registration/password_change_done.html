{% extends 'base.html' %}
{% block title %}Password changed · EduTrack{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-7 col-lg-5">
    <div class="card auth-card">
      <div class="card-body text-center">
        <div class="brand-mark mx-auto mb-2" style="width: 52px; height: 52px;"><i class="bi bi-shield-check"></i></div>
        <h1 class="auth-title">Password updated</h1>
        <p class="auth-subtitle">Your password has been changed successfully.</p>
        <a href="{% url 'accounts:profile' %}" class="btn btn-primary mt-2">Back to profile</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}

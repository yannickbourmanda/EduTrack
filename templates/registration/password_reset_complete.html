{% extends 'base.html' %}
{% block title %}Password reset complete · EduTrack{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-7 col-lg-5">
    <div class="card auth-card">
      <div class="card-body text-center">
        <div class="brand-mark mx-auto mb-2" style="width: 52px; height: 52px;"><i class="bi bi-shield-check"></i></div>
        <h1 class="auth-title">Password reset complete</h1>
        <p class="auth-subtitle">Your password has been set. You can now sign in with the new password.</p>
        <a href="{{ login_url }}" class="btn btn-primary mt-2">Sign in</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
